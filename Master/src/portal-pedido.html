<!doctype html>
<html lang="pt-br">
<head>
  @@include("partials/title-meta.html", {"title": "Pedido"})
  @@include("partials/head-css.html")
  <link href="assets/css/portal-shell.css?v=3" rel="stylesheet">
</head>
<body>
  @@include("partials/portal-shell.html")
  <div class="portal-body" style="max-width: 760px;">
    <p class="mb-3"><a href="portal-pedidos.html">← Voltar aos pedidos</a></p>
    <div id="boxLoading" class="text-muted">Carregando pedido…</div>
    <div id="boxErro" class="alert alert-danger d-none"></div>
    <div id="boxPedido" class="d-none">
      <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
        <div>
          <h1 class="portal-page-title mb-1" id="pedidoCodigo">Pedido</h1>
          <p class="text-muted mb-0" id="pedidoCanal"></p>
        </div>
        <div class="text-md-end">
          <span id="pedidoStatus"></span>
          <div class="small text-muted mt-1" id="pedidoAtualizado"></div>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="h6">Destinatário</h2>
          <p class="mb-1 fw-semibold" id="destNome"></p>
          <p class="mb-1 text-muted" id="destEndereco"></p>
          <p class="mb-0" id="destTelefone"></p>
        </div>
      </div>
      <div id="boxRecebimento" class="alert alert-success d-none mb-3">
        Recebido por: <strong id="recebimentoTxt"></strong>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="h6">Acompanhamento</h2>
          <div id="timelineVazia" class="text-muted d-none">Ainda não há eventos neste pedido.</div>
          <ol id="timeline" class="list-group list-group-flush portal-detail-timeline"></ol>
        </div>
      </div>
      <div id="boxAcoes" class="d-none d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-soft-primary" id="btnPdf">Reimprimir etiqueta</button>
        <button type="button" class="btn btn-soft-danger d-none" id="btnCancelar">Cancelar etiqueta</button>
      </div>
    </div>
  </div>
  </div><!-- /.portal-main -->
</div><!-- /.portal-app -->

<script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/plugins.js"></script>
<script src="assets/js/pages/portal-common.js?v=5"></script>
<script src="assets/js/pages/portal-pedido.init.js?v=5"></script>
</body>
</html>
