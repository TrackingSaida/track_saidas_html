<!doctype html>
<html lang="pt-br">
<head>
    @@include("partials/title-meta.html", {"title": "Conectado - Tracking Saídas"})
    @@include("partials/head-css.html")
</head>
<body>
  <div class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
    <div class="bg-overlay"></div>
    <div class="auth-page-content overflow-hidden pt-lg-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7">
            <div class="card overflow-hidden border-0 shadow-lg">
              <div class="card-body p-5 text-center">
                <div class="avatar-lg mx-auto mb-4 rounded-circle bg-success bg-soft d-flex align-items-center justify-content-center p-2">
                  <img src="assets/images/logo-pin.png" alt="Tracking Saídas" class="rounded-circle" style="max-width:100%;max-height:100%;object-fit:contain;">
                </div>
                <h4 class="mb-2">Conectado ao Tracking Saídas</h4>
                <p class="text-muted mb-4" id="msg">Sua conta foi conectada com sucesso. Você já pode utilizar os recursos do sistema.</p>
                <a href="landing-tracking.html" class="btn btn-primary">Ir para o site</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  @@include("partials/vendor-scripts.html")
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var ml = params.get("ml");
      var shopee = params.get("shopee");
      var msg = document.getElementById("msg");
      if (ml === "ja_existe" || shopee === "ja_existe") {
        msg.textContent = "Sua conta já estava conectada ao Tracking Saídas. Nenhuma alteração foi necessária.";
      }
      // Caso contrário mantém a mensagem padrão já definida no HTML
    })();
  </script>
</body>
</html>
