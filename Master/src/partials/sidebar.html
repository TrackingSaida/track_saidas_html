  <div id="scrollbar">
    <div class="container-fluid">
      <div id="two-column-menu"></div>

      <!-- MENU dinâmico (fica oculto até montar) -->
      <ul class="navbar-nav" id="navbar-nav" style="display:none;">
        <li class="menu-title"><span data-key="t-menu">Menu</span></li>
      </ul>

      <!-- ajustes de layout para caret ficar à direita e sem sobrepor o texto -->
      <style>
        .navbar-nav .nav-link.menu-link{display:flex;align-items:center;gap:.5rem}
        .navbar-nav .nav-link.menu-link .menu-arrow{margin-left:auto}
        /* subgrupos (Coletas/Saídas) com indentação leve */
        .nav-subgroup .nav-link.menu-link{padding-left:2.25rem}
        .nav-subgroup .menu-dropdown .nav-link{padding-left:2.75rem}
      </style>

      <script>
      (async function montarSidebar(){
        const nav = document.getElementById('navbar-nav');
        if (!nav || nav.dataset.initialized === '1') return; // evita montar 2x
        nav.dataset.initialized = '1';

        const API_BASE  = 'https://track-saidas-api.onrender.com';
        const LOGIN_URL = 'auth-login-tracking.html';

        const token     = localStorage.getItem('token');
        const headers   = token ? { Authorization: 'Bearer ' + token } : {};
        const fetchOpts = { method: 'GET', headers, credentials: token ? 'omit' : 'include' };

        const currentFile = (location.pathname.split('/').pop()||'').toLowerCase();
        const toId = (s)=> ('id_'+String(s||'').toLowerCase()
                      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                      .replace(/[^a-z0-9]+/g,'_'));

        const makeLeaf = (href,label)=>{
          const active = currentFile && href.toLowerCase().endsWith(currentFile);
          return `<li class="nav-item"><a href="${href}" class="nav-link ${active?'active':''}">${label}</a></li>`;
        };

        const makeGroup = (id, icon, title, innerHTML, extraClass='')=>`
          <li class="nav-item ${extraClass}">
            <a class="nav-link menu-link" href="#${id}" data-bs-toggle="collapse" role="button"
               aria-expanded="false" aria-controls="${id}">
              <i class="${icon||''}"></i>
              <span class="text-truncate">${title}</span>
              <span class="menu-arrow"></span>
            </a>
            <div class="collapse menu-dropdown" id="${id}">
              <ul class="nav nav-sm flex-column">
                ${innerHTML}
              </ul>
            </div>
          </li>`;

        try{
          const resp = await fetch(`${API_BASE}/ui/menu`, fetchOpts);
          if (resp.status === 401){ window.location.href = LOGIN_URL; return; }
          if (!resp.ok){ console.error('Falha ao carregar menu:', resp.status); return; }

          const data = await resp.json();
          const serverMenu = Array.isArray(data.menu)? data.menu : [];

          // limpa (preserva título)
          nav.querySelectorAll(':scope > li:not(.menu-title)').forEach(el=>el.remove());

          // ===== Operação (com subgrupos Coletas e Saídas) =====
          // tenta aproveitar itens vindos do servidor
          let operacao = serverMenu.find(s => (s.section||'').toLowerCase().includes('opera'));
          if (!operacao) operacao = {section:'Operação', icon:'las la-motorcycle', items:[]};

          const isColeta = (i)=> /coleta/i.test(i.label||'') || /coleta/i.test(i.href||'');
          const isSaida  = (i)=> /sa[ií]da/i.test(i.label||'') || /tracking-(leitura|registros)/i.test(i.href||'');

          const serverColetas = (operacao.items||[]).filter(isColeta);
          const serverSaidas  = (operacao.items||[]).filter(isSaida);

          const extrasColetas = [
            {label:'Leitura de Coletas', href:'tracking-coleta-leitura.html'},
            {label:'Resumo de Coletas',  href:'tracking-coletas-resumo.html'},
          ];
          const extrasSaidas = [
            {label:'Leitura de Saídas',  href:'tracking-leitura.html'},
            {label:'Registros de Saídas', href:'tracking-registros.html'},
          ];

          const merge = (base, extras) => {
            const out = [...base];
            for (const e of extras){
              if (!out.some(i => (i.href||'').toLowerCase() === e.href.toLowerCase())){
                out.push(e);
              }
            }
            return out;
          };

          const coletasItems = merge(serverColetas, extrasColetas).map(i=>makeLeaf(i.href,i.label)).join('');
          const saidasItems  = merge(serverSaidas,  extrasSaidas ).map(i=>makeLeaf(i.href,i.label)).join('');

          const idOperacao = toId('operacao');
          const idColetas  = toId('operacao_coletas');
          const idSaidas   = toId('operacao_saidas');

          const opInner = 
              makeGroup(idColetas, 'ri-box-3-line me-1', 'Coletas', coletasItems, 'nav-subgroup') +
              makeGroup(idSaidas,  'ri-truck-line me-1', 'Saídas',  saidasItems,  'nav-subgroup');

          nav.insertAdjacentHTML('beforeend',
            makeGroup(idOperacao, operacao.icon||'las la-motorcycle', 'Operação', opInner)
          );

          // ===== Dashboards =====
          const dashboards = serverMenu.find(s => (s.section||'').toLowerCase()==='dashboards')
                            || {section:'Dashboards', icon:'ri-dashboard-2-line', items:[]};
          const dashInner = (dashboards.items||[]).length
              ? dashboards.items.map(i=>makeLeaf(i.href,i.label)).join('')
              : makeLeaf('dashboard-tracking-saidas.html','Tracking');

          nav.insertAdjacentHTML('beforeend',
            makeGroup(toId('dashboards'), dashboards.icon||'ri-dashboard-2-line', 'Dashboards', dashInner)
          );

          // ===== Configurações =====
          const configs = serverMenu.find(s => (s.section||'').toLowerCase().startsWith('config'))
                        || {section:'Configurações', icon:'ri-settings-3-line', items:[]};
          const hasBases = (configs.items||[]).some(i => /tracking-base\.html$/i.test(i.href||''));
          if (!hasBases) (configs.items = configs.items||[]).push({label:'Bases', href:'tracking-base.html'});

          const cfgInner = (configs.items||[]).map(i=>makeLeaf(i.href,i.label)).join('');

          nav.insertAdjacentHTML('beforeend',
            makeGroup(toId('configuracoes'), configs.icon||'ri-settings-3-line', 'Configurações', cfgInner)
          );

          // abre automaticamente a(s) seção(ões) do item ativo
          const active = nav.querySelector('.nav-link.active');
          if (active && typeof bootstrap!=='undefined'){
            let c = active.closest('.menu-dropdown');
            while (c){
              new bootstrap.Collapse(c, {toggle:true});
              c = c.parentElement?.closest('.menu-dropdown');
            }
          }

          nav.style.display = ''; // exibe menu
        }catch(err){
          console.error('Erro ao montar sidebar:', err);
        }
      })();
      </script>
    </div>
  </div>
