      <!-- SCRIPT -->
      <script>
        if (!window.__SIDEBAR_BUILT__) window.__SIDEBAR_BUILT__ = false;
        if (!window.__SIDEBAR_BUILDING__) window.__SIDEBAR_BUILDING__ = false;
        if (!window.__SIDEBAR_SCHEDULED__) window.__SIDEBAR_SCHEDULED__ = false;

        (function scheduleMountOnce() {
          if (window.__SIDEBAR_SCHEDULED__) return;
          window.__SIDEBAR_SCHEDULED__ = true;

          const launch = () => setTimeout(montarSidebar, 0);
          const readyDOM = document.readyState === "interactive" || document.readyState === "complete";
          const readyBS = (typeof window.bootstrap !== "undefined");

          if (readyDOM && readyBS) {
            launch();
          } else {
            if (!readyDOM) document.addEventListener("DOMContentLoaded", launch, { once: true });
            if (!readyBS) window.addEventListener("load", launch, { once: true });
          }
        })();

    async function montarSidebar() {
  if (window.__SIDEBAR_BUILT__ || window.__SIDEBAR_BUILDING__) return;
  window.__SIDEBAR_BUILDING__ = true;
  const nav = document.getElementById("navbar-nav");
  if (!nav) return;

  const API_BASE = "https://track-saidas-api.onrender.com";
  const LOGIN_URL = "auth-login-tracking.html";

  const fetchOpts = {
    method: "GET",
    credentials: "include" // 👈 envia cookie access_token
  };

  const toId = (label) => (
    "sidebar-" + String(label || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "")
  );

  const currentFile = (location.pathname.split("/").pop() || "").toLowerCase();
  const makeItem = (href, label, icon) => {
    const isActive = currentFile && href && href.toLowerCase().endsWith(currentFile);
    const iconHtml = icon ? `<i class="${icon} me-1"></i>` : "";
    return `<li class="nav-item"><a href="${href || '#'}" class="nav-link ${isActive ? 'active' : ''}">${iconHtml}${label}</a></li>`;
  };

  const makeGroup = (id, icon, title, innerHTML) => (`
    <li class="nav-item">
      <a class="nav-link menu-link" href="javascript:void(0)" data-bs-toggle="collapse" data-bs-target="#${id}" role="button"
        aria-expanded="false" aria-controls="${id}">
        <i class="${icon || ''}"></i>
        <span>${title}</span>
        <span class="menu-arrow"></span>
      </a>
      <div class="collapse menu-dropdown" id="${id}">
        <ul class="nav nav-sm flex-column">${innerHTML}</ul>
      </div>
    </li>`);

  try {
    const resp = await fetch(`${API_BASE}/api/ui/menu`, fetchOpts);
    if (resp.status === 401) { window.location.href = LOGIN_URL; return; }
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const serverMenu = Array.isArray(data.menu) ? data.menu : [];

    // Limpa menu anterior
    nav.querySelectorAll(":scope > li:not(.menu-title)").forEach(el => el.remove());

    // Procura seção "Operação"
  const operacao = serverMenu.find(s =>
  (s.section || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .includes("oper")
);

const dashboards = serverMenu.find(s => {
  const name = (s.section || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  // Compatível com seções chamadas "Dashboards" ou "Indicadores"
  return name === "dashboards" || name.includes("indicador");
});

const cadastros = serverMenu.find(s =>
  (s.section || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .includes("cadastr")
);

const config = serverMenu.find(s =>
  (s.section || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .includes("config")
);


    // 🔹 Monta grupo Operação → Leituras / Registros
let opHTML = "";

if (operacao) {
  const opItems = operacao.items || [];

  const grupoRegistrar = opItems.filter(i => i.group === "leituras");
  const grupoRegistros = opItems.filter(i => i.group === "registros");
  const grupoEtiquetas = opItems.filter(i => i.group === "etiquetas");

  if (grupoRegistrar.length) {
    opHTML += makeGroup(
      toId("Leituras"),
      "ri-qr-scan-line me-1",
      "Leituras",
      grupoRegistrar.map(i => makeItem(i.href, i.label)).join("")
    );
  }

  if (grupoRegistros.length) {
    opHTML += makeGroup(
      toId("Registros"),
      "ri-folder-open-line me-1",
      "Registros",
      grupoRegistros.map(i => makeItem(i.href, i.label)).join("")
    );
  }

  if (grupoEtiquetas.length) {
    opHTML += makeGroup(
      toId("Etiquetas"),
      "ri-qr-code-line me-1",
      "Etiquetas",
      grupoEtiquetas.map(i => makeItem(i.href, i.label, i.icon)).join("")
    );
  }
}

    // 🔹 Monta grupo Financeiro (itens diretos: Resumo de Coletas, Resumo por Entregador, Contabilidade)
    const financeiro = serverMenu.find(s =>
      (s.section || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes("financeiro")
    );
    let finHTML = "";
    if (financeiro) {
      const itensFinanceiro = financeiro.items || [];
      finHTML = itensFinanceiro.map(i => makeItem(i.href, i.label)).join("");
    }


    // 🔹 Monta dashboards, cadastros e config somente se vierem do backend
    const dashHTML = dashboards
      ? dashboards.items.map(i => makeItem(i.href, i.label)).join("")
      : "";
    const cadHTML = cadastros
      ? (cadastros.items || []).map(i => makeItem(i.href, i.label)).join("")
      : "";
    const cfgHTML = config
      ? (config.items || []).map(i => makeItem(i.href, i.label)).join("")
      : "";

    // 🔹 Monta HTML final, apenas se existir
    let finalHTML = "";
    if (operacao) finalHTML += makeGroup(toId(operacao.section), operacao.icon, operacao.section, opHTML);
    if (financeiro && finHTML) finalHTML += makeGroup(toId(financeiro.section), financeiro.icon, financeiro.section, finHTML);
    if (dashboards) finalHTML += makeGroup(toId(dashboards.section), dashboards.icon, dashboards.section, dashHTML);
    if (cadastros && cadHTML) finalHTML += makeGroup(toId(cadastros.section), cadastros.icon, cadastros.section, cadHTML);
    if (config) finalHTML += makeGroup(toId(config.section), config.icon, config.section, cfgHTML);

    // Injeta no DOM
    nav.insertAdjacentHTML("beforeend", finalHTML);

    // Expande o grupo ativo
    const activeLink = nav.querySelector(".nav-link.active");
    if (activeLink && typeof bootstrap !== "undefined") {
      const collapse = activeLink.closest(".menu-dropdown");
      if (collapse) new bootstrap.Collapse(collapse, { toggle: true });
    }

    nav.style.visibility = "visible";
    nav.style.opacity = "1";
    if (window.dispatchEvent) window.dispatchEvent(new Event("resize"));
    window.__SIDEBAR_BUILT__ = true;
    window.__SIDEBAR_BUILDING__ = false;
  } catch (e) {
    window.__SIDEBAR_BUILDING__ = false;
    console.error("Erro ao montar sidebar:", e);
  }
}
      </script>

      <script>
        // Redireciona o clique no logo "Tracking Saídas" para a home correta por perfil
        (function () {
          "use strict";

          function resolveHomeFromUser(user) {
            try {
              const role = Number((user && user.role) || 0);
              const ignorarColeta = !!(user && user.ignorar_coleta);

              if (role === 0) return "dashboard-admin.html";
              if ((role === 0 || role === 1) && ignorarColeta) return "dashboard-saidas.html";
              if (role === 1) return "dashboard-visao-360.html"; // ignorar_coleta=false → Visão 360
              if (role === 3) return "tracking-coleta-leitura.html"; // Coletador
              return "tracking-leitura.html"; // Operador (role 2) ou fallback
            } catch (_) {
              return "tracking-leitura.html";
            }
          }

          function handleLogoClick(ev) {
            if (ev && typeof ev.preventDefault === "function") ev.preventDefault();

            const user = window.__USER__;
            // Se não houver usuário carregado, força checagem de auth (pode mandar para login)
            if (!user && typeof window.ensureAuth === "function") {
              window.ensureAuth();
              return;
            }

            const destino = resolveHomeFromUser(user);
            window.location.href = destino;
          }

          document.addEventListener("DOMContentLoaded", function () {
            document
              .querySelectorAll(".navbar-brand-box a.logo")
              .forEach(function (el) {
                el.addEventListener("click", handleLogoClick);
              });
          });
        })();
      </script>
