    <div id="scrollbar">
        <div class="container-fluid">

            <div id="two-column-menu">
            </div>

            <!-- ======= MENU DINÂMICO (somente este bloco foi alterado) ======= -->
            <ul class="navbar-nav" id="navbar-nav" style="display:none;">
                <li class="menu-title"><span data-key="t-menu">Menu</span></li>
                <!-- Itens serão inseridos via JS -->
            </ul>

            <script>
            (async function montarSidebar() {
              const nav = document.getElementById("navbar-nav");
              if (!nav) return;

              // Suporte a cookie OU bearer
              const token = localStorage.getItem("token");
              const headers = token ? { "Authorization": "Bearer " + token } : {};

              try {
                const resp = await fetch("/ui/menu", { headers });
                if (resp.status === 401) { window.location.href = "/login"; return; }
                if (!resp.ok) { console.error("Falha ao carregar menu:", resp.status); return; }
                const data = await resp.json();
                const menu = data.menu || [];

                // remove qualquer item já existente (mantém o título)
                nav.querySelectorAll(":scope > li:not(.menu-title)").forEach(el => el.remove());

                // util: id de colapse a partir do nome da seção
                const toId = (label) => ("sidebar-" + String(label || "")
                  .toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                  .replace(/[^a-z0-9]+/g, "")
                );

                // marca página ativa (opcional)
                const currentPath = location.pathname.split("/").pop();

                for (const sec of menu) {
                  const secId = toId(sec.section);
                  const li = document.createElement("li");
                  li.className = "nav-item";
                  li.innerHTML = `
                    <a class="nav-link menu-link" href="#${secId}" data-bs-toggle="collapse" role="button"
                       aria-expanded="false" aria-controls="${secId}">
                      <i class="${sec.icon || ""}"></i> <span>${sec.section}</span>
                    </a>
                    <div class="collapse menu-dropdown" id="${secId}">
                      <ul class="nav nav-sm flex-column">
                        ${(sec.items || []).map(i => {
                          const href = i.href || "#";
                          const active = href === currentPath ? "active" : "";
                          return `
                            <li class="nav-item">
                              <a href="${href}" class="nav-link ${active}">${i.label}</a>
                            </li>
                          `;
                        }).join("")}
                      </ul>
                    </div>
                  `;
                  nav.appendChild(li);
                }

                // abre a seção do item ativo (opcional)
                const activeLink = nav.querySelector(".nav-link.active");
                if (activeLink) {
                  const collapse = activeLink.closest(".menu-dropdown");
                  if (collapse && typeof bootstrap !== "undefined") {
                    new bootstrap.Collapse(collapse, { toggle: true });
                  }
                }

                // mostra o menu após montar
                nav.style.display = "";
              } catch (e) {
                console.error("Erro ao montar sidebar:", e);
              }
            })();
            </script>
            <!-- ======= FIM MENU DINÂMICO ======= -->

        </div>
