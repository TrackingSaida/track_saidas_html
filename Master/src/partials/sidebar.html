  <div id="scrollbar">
    <div class="container-fluid">

      <!-- MENU dinâmico: invisível até montar (presente no DOM p/ mobile) -->
      <ul class="navbar-nav" id="navbar-nav" style="visibility:hidden;opacity:0;">
        <li class="menu-title"><span data-key="t-menu">Menu</span></li>
        <!-- Os itens virão via JS -->
      </ul>

      <script>
        // --- FLAG global p/ evitar montagem dupla (includes/partials repetidos) ---
        if (!window.__SIDEBAR_BUILT__) {
          window.__SIDEBAR_BUILT__ = false;
        }

        // Agenda de montagem: espera DOM + Bootstrap
        (function scheduleMount() {
          const readyDOM = document.readyState === "interactive" || document.readyState === "complete";
          const readyBS  = (typeof window.bootstrap !== "undefined");

          if (readyDOM && readyBS) {
            // pequeno defer para garantir que scripts como app.js tenham rodado
            setTimeout(montarSidebar, 50);
          } else {
            // Prende nos eventos e tenta de novo
            if (!readyDOM) document.addEventListener("DOMContentLoaded", () => setTimeout(scheduleMount, 0), { once: true });
            if (!readyBS)  window.addEventListener("load",           () => setTimeout(scheduleMount, 0), { once: true });
            // fallback: tenta de novo em 200ms (evita ficar preso se eventos já passaram)
            setTimeout(() => {
              if (!window.__SIDEBAR_BUILT__) scheduleMount();
            }, 200);
          }
        })();

        async function montarSidebar() {
          if (window.__SIDEBAR_BUILT__) return; // idempotente
          const nav = document.getElementById("navbar-nav");
          if (!nav) return;

          const API_BASE  = "https://track-saidas-api.onrender.com";
          const LOGIN_URL = "auth-login-tracking.html";

          const token   = localStorage.getItem("token");
          const headers = token ? { "Authorization": "Bearer " + token } : {};
          const fetchOpts = { method: "GET", headers, credentials: token ? "omit" : "include" };

          const toId = (label) => ("sidebar-" + String(label || "")
            .toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "")
          );

          const currentFile = (location.pathname.split("/").pop() || "").toLowerCase();

          const makeItem = (href, label) => {
            const isActive = currentFile && href && href.toLowerCase().endsWith(currentFile);
            return `
              <li class="nav-item">
                <a href="${href || '#'}" class="nav-link ${isActive ? "active" : ""}">${label}</a>
              </li>`;
          };

          const makeGroup = (id, icon, title, innerHTML) => (`
            <li class="nav-item">
              <a class="nav-link menu-link" href="#${id}" data-bs-toggle="collapse" role="button"
                 aria-expanded="false" aria-controls="${id}">
                <i class="${icon || ""}"></i> <span>${title}</span>
              </a>
              <div class="collapse menu-dropdown" id="${id}">
                <ul class="nav nav-sm flex-column">
                  ${innerHTML}
                </ul>
              </div>
            </li>
          `);

          // retry leve para rede lenta/cache frio
          async function fetchMenuWithRetry(url, opts, tries = 2) {
            try {
              const r = await fetch(url, opts);
              if (r.status === 401) { window.location.href = LOGIN_URL; return null; }
              if (!r.ok) throw new Error("HTTP " + r.status);
              return await r.json();
            } catch (err) {
              if (tries > 0) {
                await new Promise(res => setTimeout(res, 120));
                return fetchMenuWithRetry(url, opts, tries - 1);
              }
              console.error("Falha ao carregar /ui/menu:", err);
              return null;
            }
          }

          try {
            const data = await fetchMenuWithRetry(`${API_BASE}/ui/menu`, fetchOpts);
            if (!data) return;

            const serverMenu = Array.isArray(data.menu) ? data.menu : [];

            // Limpa (mantendo o título)
            nav.querySelectorAll(":scope > li:not(.menu-title)").forEach(el => el.remove());

            // === organização (Coletas/Saídas), Dashboards e Configurações com fallbacks ===
            let operacao = serverMenu.find(s => (s.section || "").toLowerCase() === "operação" || (s.section || "").toLowerCase() === "operacao");
            if (!operacao) operacao = { section: "Operação", icon: "las la-motorcycle", items: [] };
            operacao.icon = operacao.icon || "las la-motorcycle";
            const opItems = operacao.items || [];

            const isColeta = (i) => /coleta/i.test(i.href || "") || /coleta/i.test(i.label || "");
            const isSaida  = (i) => /tracking-(leitura|registros)/i.test(i.href || "") || /sa[ií]da/i.test(i.label || "");
            const coletasAPI = opItems.filter(isColeta);
            const saidasAPI  = opItems.filter(isSaida);

            const extrasColetas = [
              { label: "Leitura de Coletas", href: "tracking-coleta-leitura.html" },
              { label: "Resumo de Coletas",  href: "tracking-coletas-resumo.html" },
            ];
            const extrasSaidas = [
              { label: "Leitura de Saídas",  href: "tracking-leitura.html" },
              { label: "Registros de Saídas", href: "tracking-registros.html" },
            ];

            const grupoColetas = [...coletasAPI];
            extrasColetas.forEach(e => { if (!grupoColetas.some(i => (i.href||"").toLowerCase() === e.href.toLowerCase())) grupoColetas.push(e); });
            const grupoSaidas  = [...saidasAPI];
            extrasSaidas.forEach(e => { if (!grupoSaidas.some(i => (i.href||"").toLowerCase() === e.href.toLowerCase())) grupoSaidas.push(e); });

            const opHTML =
              makeGroup(toId("Coletas"), "ri-box-3-line me-1", "Coletas",
                grupoColetas.map(i => makeItem(i.href, i.label)).join("")
              )
              +
              makeGroup(toId("Saídas"), "ri-truck-line me-1", "Saídas",
                grupoSaidas.map(i => makeItem(i.href, i.label)).join("")
              );

            const dashboards = serverMenu.find(s => (s.section || "").toLowerCase() === "dashboards") || { section:"Dashboards", icon:"ri-dashboard-2-line", items:[] };
            dashboards.icon = dashboards.icon || "ri-dashboard-2-line";
            const dashHTML = dashboards.items && dashboards.items.length
              ? dashboards.items.map(i => makeItem(i.href, i.label)).join("")
              : makeItem("dashboard-tracking-saidas.html","Tracking");

            const config = serverMenu.find(s => (s.section || "").toLowerCase() === "configurações" || (s.section || "").toLowerCase() === "configuracoes")
              || { section:"Configurações", icon:"ri-settings-3-line", items:[] };
            config.icon = config.icon || "ri-settings-3-line";
            const temBases = (config.items||[]).some(i => /tracking-base\.html$/i.test(i.href||""));
            if (!temBases) (config.items = config.items || []).push({ label:"Bases", href:"tracking-base.html" });
            const cfgHTML = (config.items || []).map(i => makeItem(i.href, i.label)).join("");

            nav.insertAdjacentHTML("beforeend",
              makeGroup(toId(operacao.section), operacao.icon, operacao.section, opHTML) +
              makeGroup(toId(dashboards.section), dashboards.icon, dashboards.section, dashHTML) +
              makeGroup(toId(config.section), config.icon, config.section, cfgHTML)
            );

            // Abre a seção do item ativo (se houver)
            const activeLink = nav.querySelector(".nav-link.active");
            if (activeLink && typeof bootstrap !== "undefined") {
              const collapse = activeLink.closest(".menu-dropdown");
              if (collapse) new bootstrap.Collapse(collapse, { toggle: true });
              const parentCollapse = collapse && collapse.closest(".menu-dropdown");
              if (parentCollapse) new bootstrap.Collapse(parentCollapse, { toggle: true });
            }

            // ===== MOBILE + RACE FIX =====
            // Torna visível sem piscar
            nav.style.visibility = "visible";
            nav.style.opacity    = "1";

            // Notifica reflow
            if (window.dispatchEvent) window.dispatchEvent(new Event("resize"));

            // Se o menu lateral já estiver aberto, re-toggles rápido para sincronizar
            const isMobile = window.matchMedia("(max-width: 991.98px)").matches;
            const overlay   = document.querySelector(".vertical-overlay");
            const hamburger = document.getElementById("topnav-hamburger-icon") || document.getElementById("vertical-hover");
            if (isMobile && overlay && overlay.classList.contains("show") && hamburger) {
              hamburger.click();
              setTimeout(() => hamburger.click(), 80);
            }
            // ===== FIM FIX =====

            window.__SIDEBAR_BUILT__ = true; // marca como montado
          } catch (e) {
            console.error("Erro ao montar sidebar:", e);
          }
        }
      </script>
      <!-- ======= FIM MENU DINÂMICO ======= -->

    </div>
    <!-- Sidebar -->
  </div>

  <div class="sidebar-background"></div>
