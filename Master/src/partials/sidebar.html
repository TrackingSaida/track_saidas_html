  <div id="scrollbar">

      <!-- ======= MENU DINÂMICO ======= -->
      <ul class="navbar-nav" id="navbar-nav" style="display:none;">
        <li class="menu-title"><span data-key="t-menu">Menu</span></li>
      </ul>

      <style>
        .navbar-nav .nav-link.menu-link {
          display: flex;
          align-items: center;
          gap: .5rem;
        }
        .navbar-nav .nav-link.menu-link .menu-arrow {
          margin-left: auto;
        }
      </style>

      <script>
        (async function montarSidebar() {
          const nav = document.getElementById("navbar-nav");
          if (!nav) return;

          const API_BASE = "https://track-saidas-api.onrender.com";
          const LOGIN_URL = "auth-login-tracking.html";

          const token = localStorage.getItem("token");
          const headers = token ? { "Authorization": "Bearer " + token } : {};
          const fetchOpts = { method: "GET", headers, credentials: token ? "omit" : "include" };

          try {
            const resp = await fetch(`${API_BASE}/ui/menu`, fetchOpts);
            if (resp.status === 401) { window.location.href = LOGIN_URL; return; }
            if (!resp.ok) { console.error("Falha ao carregar menu:", resp.status); return; }

            const data = await resp.json();
            const menu = data.menu || [];

            nav.querySelectorAll(":scope > li:not(.menu-title)").forEach(el => el.remove());

            const toId = (label) => ("sidebar-" + String(label || "")
              .toLowerCase()
              .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
              .replace(/[^a-z0-9]+/g, "")
            );

            const currentFile = (location.pathname.split("/").pop() || "").toLowerCase();

            const makeItem = (href, label) => {
              const isActive = currentFile && href.toLowerCase().endsWith(currentFile);
              return `
                <li class="nav-item">
                  <a href="${href}" class="nav-link ${isActive ? "active" : ""}">${label}</a>
                </li>`;
            };

            const makeGroup = (id, icon, title, innerHTML) => (`
              <li class="nav-item">
                <a class="nav-link menu-link" href="#${id}" data-bs-toggle="collapse" role="button"
                   aria-expanded="false" aria-controls="${id}">
                  <i class="${icon || ""}"></i>
                  <span class="text-truncate">${title}</span>
                  <span class="menu-arrow"></span>
                </a>
                <div class="collapse menu-dropdown" id="${id}">
                  <ul class="nav nav-sm flex-column">
                    ${innerHTML}
                  </ul>
                </div>
              </li>
            `);

            for (const sec of menu) {
              const secId = toId(sec.section);
              const innerHTML = (sec.items || []).map(i => makeItem(i.href || "#", i.label)).join("");
              const html = makeGroup(secId, sec.icon, sec.section, innerHTML);
              nav.insertAdjacentHTML("beforeend", html);
            }

            const activeLink = nav.querySelector(".nav-link.active");
            if (activeLink) {
              const collapse = activeLink.closest(".menu-dropdown");
              if (collapse && typeof bootstrap !== "undefined") {
                new bootstrap.Collapse(collapse, { toggle: true });
              }
            }

            nav.style.display = "";
          } catch (e) {
            console.error("Erro ao montar sidebar:", e);
          }
        })();
      </script>
      <!-- ======= FIM MENU DINÂMICO ======= -->

    </div>
  </div>
