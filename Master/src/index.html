<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Tracking Saídas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

<script>
  const API_AUTH = 'https://track-saidas-api.onrender.com/api/auth';

  function getCookie(name) {
    return document.cookie
      .split('; ')
      .find(row => row.startsWith(name + '='))?.split('=')[1] || null;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(location.search);
    const next = params.get('next');

    const hasMarker =
      localStorage.getItem('trackingToken') ||
      sessionStorage.getItem('trackingToken') ||
      localStorage.getItem('access_token') ||
      sessionStorage.getItem('access_token') ||
      localStorage.getItem('acess_token') ||
      sessionStorage.getItem('acess_token') ||
      getCookie('access_token');

    if (hasMarker) {
      try {
        const me = await fetch(`${API_AUTH}/me`, { credentials: 'include' });
        if (me.ok) {
          // Se foi autenticado via cookie, grava um marcador simples.
          if (!localStorage.getItem('trackingToken')) {
            localStorage.setItem('trackingToken', 'cookie-session');
          }
          let destino = next;
          if (!destino) {
            const user = await me.json().catch(() => ({}));
            const role = Number(user?.role ?? 0);
            if (role === 0) destino = 'dashboard-admin.html';
            else if ((role === 0 || role === 1) && user?.ignorar_coleta === true) destino = 'dashboard-saidas.html';
            else if (role === 1) destino = 'dashboard-visao-360.html';
            else if (role === 3 && user?.ignorar_coleta !== true && ['codigo', 'ambos'].includes(user?.modo_operacao || 'codigo')) destino = 'tracking-coleta-leitura.html';
            else if (role === 3) destino = 'tracking-leitura.html';
            else destino = 'tracking-leitura.html';  // Operador (role 2)
          }
          return location.replace(destino);
        }
      } catch (e) {
        // Em caso de erro de rede, continua para limpeza e landing
      }
      // Caso /auth/me não confirme a sessão, remove todos os marcadores
      try {
        localStorage.removeItem('trackingToken');
        localStorage.removeItem('access_token');
        localStorage.removeItem('acess_token');
        sessionStorage.removeItem('trackingToken');
        sessionStorage.removeItem('access_token');
        sessionStorage.removeItem('acess_token');
      } catch (_) {}
    }
    // Sem sessão válida → landing
    location.replace('landing-tracking.html');
  });
</script>


  <style>
    /* Mensagem de fallback enquanto redireciona */
    html, body { height: 100%; margin: 0; }
    .center {
      height: 100%; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #6c757d; text-align: center; padding: 24px;
    }
    .spinner {
      width: 42px; height: 42px; border: 3px solid #e9ecef; border-top-color: #0d6efd;
      border-radius: 50%; margin: 0 auto 12px; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="center" aria-live="polite" aria-busy="true">
    <div class="spinner" role="img" aria-label="Carregando"></div>
    <div>Redirecionando…</div>
    <small>Se não acontecer automaticamente, <a href="landing-tracking.html">clique aqui</a>.</small>
  </div>

  <!-- Fallback caso o JavaScript esteja desabilitado -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=landing-tracking.html">
  </noscript>
</body>
</html>
