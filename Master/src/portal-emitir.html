<!doctype html>
<html lang="pt-br">
<head>
  @@include("partials/title-meta.html", {"title": "Emitir etiqueta"})
  @@include("partials/head-css.html")
</head>
<body class="bg-light">
  @@include("partials/portal-nav.html")
  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h4 mb-3">Emitir etiqueta</h1>
    <div id="boxTrocaSenha" class="card mb-3 d-none">
      <div class="card-body">
        <p class="mb-2">Troque a senha temporária para continuar.</p>
        <div class="mb-2">
          <label class="form-label" for="novaSenha">Nova senha</label>
          <input type="password" class="form-control" id="novaSenha" minlength="8">
        </div>
        <button type="button" class="btn btn-primary" id="btnTrocarSenha">Salvar senha</button>
      </div>
    </div>
    <div id="boxEmitir" class="card">
      <div class="card-body">
        <h2 class="h6">Remetente</h2>
        <p id="remetenteResumo" class="text-muted">Carregando…</p>
        <h2 class="h6 mt-3">Destinatário</h2>
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label" for="destNome">Nome</label>
            <input class="form-control" id="destNome">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="destCep">CEP</label>
            <input class="form-control" id="destCep" inputmode="numeric">
            <small id="hintCep" class="text-danger d-none"></small>
          </div>
          <div class="col-md-8">
            <label class="form-label" for="destRua">Rua</label>
            <input class="form-control" id="destRua">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="destNumero">Número</label>
            <input class="form-control" id="destNumero">
          </div>
          <div class="col-md-5">
            <label class="form-label" for="destBairro">Bairro</label>
            <input class="form-control" id="destBairro">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="destCidade">Cidade</label>
            <input class="form-control" id="destCidade">
          </div>
          <div class="col-md-1">
            <label class="form-label" for="destUf">UF</label>
            <input class="form-control" id="destUf" maxlength="2">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="destTelefone">Telefone (opcional)</label>
            <input class="form-control" id="destTelefone">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="destComplemento">Complemento (opcional)</label>
            <input class="form-control" id="destComplemento">
          </div>
        </div>
        <button type="button" class="btn btn-success mt-3" id="btnEmitir">Gerar etiqueta</button>
        <p id="emitirMsg" class="small mt-2 mb-0"></p>
      </div>
    </div>
  </main>
  <script src="assets/js/plugins.js"></script>
  <script src="assets/js/pages/portal-common.js"></script>
  <script src="assets/js/pages/portal-emitir.init.js"></script>
</body>
</html>
